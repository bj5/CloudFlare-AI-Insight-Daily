# wrangler.toml
# ============================================================
# CloudFlare-AI-Insight-Daily
# 全栈零服务器架构：Workers + Workers AI + KV + D1 + R2
# 零外部平台依赖（不需要 GitHub Actions / Docker / 外部 AI API）
# ============================================================

name            = "ai-daily"
main            = "src/index.js"
compatibility_date = "2025-05-20"
workers_dev     = true

# ============================================================
# Cron Triggers（替代 cron-docker）
# 每天北京时间 10:00（UTC 02:00）自动抓取数据
# ============================================================
[triggers]
crons = ["0 2 * * *"]   # UTC 02:00 = 北京 10:00，每日执行

# ============================================================
# KV Namespaces
# 用途：会话存储 / 原始数据缓存 / RSS 缓存
# 创建：wrangler kv namespace create DATA_KV
# ============================================================
[[kv_namespaces]]
binding = "DATA_KV"
id = "f88ba1a3a8d54fd7a2206ea6aa3b0dc1"

# ============================================================
# D1 Database（结构化存储）
# 用途：日报元数据、RSS 条目结构化查询
# 创建：wrangler d1 create ai-daily-db
# 初始化：wrangler d1 execute ai-daily-db --file=./schema.sql
# ============================================================
[[d1_databases]]
binding  = "DB"
database_name = "ai-daily-db"
database_id   = "ac56afd0-6e3d-44d5-99ad-aa4382cef2d0"

# ============================================================
# R2 Buckets 已移除，使用 KV 作为文件存储替代
# ============================================================

# ============================================================
# Workers AI Binding（替代 Google Gemini / OpenAI）
# 无需 API Key，直接调用 Cloudflare 内置 AI 推理
# ============================================================
[ai]
binding = "AI"

# ============================================================
# 环境变量（明文配置，敏感信息请使用 wrangler secret）
# 敏感 Secrets（通过命令行设置，不要写在这里）：
#   wrangler secret put LOGIN_PASSWORD
#   wrangler secret put FOLO_COOKIE（如果需要）
# ============================================================
[vars]
# ——— Workers AI 模型配置 ———
# 推荐模型（按能力从强到弱）：
#   @cf/meta/llama-3.3-70b-instruct        （最强，中文最佳）
#   @cf/meta/llama-3.1-70b-instruct        （平衡）
#   @cf/qwen/qwen2.5-72b-instruct          （中文友好）
#   @cf/mistral/mistral-7b-instruct-v0.2   （轻量，速度快）
DEFAULT_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct"

# ——— 翻译开关 ———
OPEN_TRANSLATE = "true"

# ——— 数据源配置（Folo / Follow.is）———
FOLO_COOKIE_KV_KEY      = "folo_auth_cookie"
FOLO_DATA_API           = "https://api.follow.is/entries"
FOLO_FILTER_DAYS        = 1
NEWS_AGGREGATOR_LIST_ID = "158437828119024640"
NEWS_AGGREGATOR_FETCH_PAGES = "1"
HGPAPERS_LIST_ID        = "158437917409783808"
HGPAPERS_FETCH_PAGES    = "1"
TWITTER_LIST_ID         = "153028784690326528"
TWITTER_FETCH_PAGES     = "1"
REDDIT_LIST_ID          = "167576006499975168"
REDDIT_FETCH_PAGES      = "1"
PROJECTS_API_URL        = "https://git-trending.justlikemaki.vip/topone/?since=daily"

# ——— 登录配置 ———
LOGIN_USERNAME = "root"
# LOGIN_PASSWORD 请通过 wrangler secret put LOGIN_PASSWORD 设置

# ——— 日报内容配置 ———
DAILY_TITLE     = "AI洞察日报"
DAILY_TITLE_MIN = " `AI 日报` "
PODCAST_TITLE   = "来生小酒馆"
PODCAST_BEGIN   = "嘿，亲爱的V，欢迎收听新一期的来生情报站，我是你们的老朋友，何夕2077"
PODCAST_END     = "今天的情报就到这里，注意隐蔽，赶紧撤离"
BOOK_LINK       = ""
INSERT_FOOT     = "false"
INSERT_AD       = "false"
INSERT_APP_URL  = ""
IMG_PROXY       = ""

# ——— 已移除的配置（不再需要）———
# GEMINI_API_KEY / GEMINI_API_URL / DEFAULT_GEMINI_MODEL  → 使用 Workers AI
# OPENAI_API_KEY / OPENAI_API_URL / DEFAULT_OPEN_MODEL    → 使用 Workers AI
# GITHUB_TOKEN / GITHUB_REPO_OWNER / GITHUB_REPO_NAME / GITHUB_BRANCH → 使用 R2
# USE_MODEL_PLATFORM                                       → 固定使用 Workers AI